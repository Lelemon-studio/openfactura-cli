name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 5000
      - name: el build versionado está al día
        run: |
          bun build src/main.ts --target=node --outfile=dist/cli.js
          git diff --exit-code dist/cli.js
      - run: node dist/cli.js --help
