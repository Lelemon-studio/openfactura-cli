name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --timeout 5000
      - name: el build versionado está al día
        run: |
          bun run build:node
          git diff --exit-code dist/cli.js
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install lxml==6.0.2
      - name: los DTE validan contra los XSD del SII
        run: bun run test:xsd

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 5000

  instalacion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: empaquetar e instalar como lo hace un usuario
        shell: bash
        run: |
          npm pack --ignore-scripts
          npm install -g ./openfactura-cli-*.tgz
      - name: el comando instalado responde
        shell: bash
        run: |
          esperada=$(node -p "require('./package.json').version")
          test "$(openfactura --version)" = "$esperada"
          openfactura --help > /dev/null
          openfactura skill | grep -q "name: openfactura"
          set +e
          openfactura emitir > salida.txt 2> error.txt
          rc=$?
          set -e
          test "$rc" = "2"
          grep -q '"USAGE"' error.txt
